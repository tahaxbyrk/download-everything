<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:">
    <title>Download Everything</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <header class="top">
    <div class="top-row">
      <h1 id="title">Start downloading</h1>
      <button id="settingsBtn" class="icon-btn" type="button" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M9.93 4.27 L10.43 1.52 L13.57 1.52 L14.07 4.27 L16.00 5.07 L18.31 3.48 L20.52 5.69 L18.93 8.00 L19.73 9.93 L22.48 10.43 L22.48 13.57 L19.73 14.07 L18.93 16.00 L20.52 18.31 L18.31 20.52 L16.00 18.93 L14.07 19.73 L13.57 22.48 L10.43 22.48 L9.93 19.73 L8.00 18.93 L5.69 20.52 L3.48 18.31 L5.07 16.00 L4.27 14.07 L1.52 13.57 L1.52 10.43 L4.27 9.93 L5.07 8.00 L3.48 5.69 L5.69 3.48 L8.00 5.07 Z M15.30 12 A3.3 3.3 0 1 0 8.70 12 A3.3 3.3 0 1 0 15.30 12 Z"/></svg>
      </button>
    </div>
    <form id="urlForm" class="urlform">
      <label class="sr" for="url">Video URL</label>
      <input id="url" type="url" placeholder="Paste the video link here." autocomplete="off" spellcheck="false" required>
      <button id="fetchBtn" class="primary" type="submit">Get Info</button>
    </form>
    <p id="msg" class="msg" role="status"></p>
    </header>

    <main>
      <section id="options" class="options" hidden>
      <img id="thumb" alt="">
      <div class="info">
        <h2 id="vTitle"></h2>
        <p id="vMeta"></p>
      </div>
      <div class="controls">
        <fieldset id="modes" class="modes">
          <legend class="sr">Content to download</legend>
          <label><input type="radio" name="mode" value="both" checked><span>Video + Audio</span></label>
          <label><input type="radio" name="mode" value="audio"><span>Only Audio</span></label>
          <label><input type="radio" name="mode" value="video"><span>Only Video</span></label>
        </fieldset>
        <div id="qualityWrap" class="quality">
          <label for="quality">Quality</label>
          <select id="quality"></select>
        </div>
        <span id="estimate" class="estimate"></span>
        <button id="startBtn" class="primary" type="button">Download</button>
      </div>
      </section>

      <section class="downloads">
        <div class="list-head">
          <h2>Downloads</h2>
          <span id="count"></span>
        </div>
        <div class="cols head" aria-hidden="true">
          <span>File</span><span>Type</span><span>Size</span><span>Speed</span><span>Remaining</span><span>State</span><span></span>
        </div>
        <ul id="list" class="list"></ul>
        <p id="empty" class="empty">No download yet. Paste a link above.</p>
      </section>
    </main>

    <dialog id="settingsDialog" class="settings" aria-labelledby="settingsTitle">
      <div class="settings-panel">
        <div class="settings-head">
          <h2 id="settingsTitle">Settings</h2>
          <button id="settingsClose" class="icon-btn" type="button" aria-label="Close">&times;</button>
        </div>
        <div class="tabs" role="tablist" aria-label="Settings sections">
          <button id="tab-general" class="tab" role="tab" type="button" aria-selected="true" aria-controls="panel-general">General</button>
        </div>
        <div id="panel-general" class="tab-panel" role="tabpanel" aria-labelledby="tab-general">
          <div class="setting-row">
            <label for="themeSelect">Theme</label>
            <select id="themeSelect">
              <option value="system">System</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </div>
        </div>
        <p id="settingsMsg" class="msg" role="status"></p>
      </div>
    </dialog>

    <template id="rowTpl">
      <li class="row" data-status="">
        <span class="name"></span>
        <span class="c-ext"><b></b><small></small></span>
        <span class="c-size"></span>
        <span class="c-speed"></span>
        <span class="c-eta"></span>
        <span class="c-status"></span>
        <span class="actions">
          <button type="button" data-action="toggle"></button>
          <button type="button" data-action="cancel">Cancel</button>
          <button type="button" data-action="remove">Remove</button>
        </span>
        <span class="bar"><i></i></span>
      </li>
    </template>

    <script type="module" src="./index.js"></script>
</body>
</html>
