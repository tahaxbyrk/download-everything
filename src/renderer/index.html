<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:">
    <title>Download Everything</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <header class="top">
    <h1 id="title">Start downloading</h1>
    <form id="urlForm" class="urlform">
      <label class="sr" for="url">Video URL</label>
      <input id="url" type="url" placeholder="Paste the video link here." autocomplete="off" spellcheck="false" required>
      <button id="fetchBtn" class="primary" type="submit">Get Info</button>
    </form>
    <p id="msg" class="msg" role="status"></p>
    </header>

    <main>
      <section id="options" class="options" hidden>
      <img id="thumb" alt="">
      <div class="info">
        <h2 id="vTitle"></h2>
        <p id="vMeta"></p>
      </div>
      <div class="controls">
        <fieldset id="modes" class="modes">
          <legend class="sr">Content to download</legend>
          <label><input type="radio" name="mode" value="both" checked><span>Video + Audio</span></label>
          <label><input type="radio" name="mode" value="audio"><span>Only Audio</span></label>
          <label><input type="radio" name="mode" value="video"><span>Only Video</span></label>
        </fieldset>
        <div id="qualityWrap" class="quality">
          <label for="quality">Quality</label>
          <select id="quality"></select>
        </div>
        <span id="estimate" class="estimate"></span>
      </div>
      </section>

      <section class="downloads">
        <div class="list-head">
          <h2>Downloads</h2>
          <span id="count"></span>
        </div>
        <p id="empty" class="empty">No download yet. Paste a link above.</p>
      </section>
    </main>

    <script type="module" src="./index.js"></script>
</body>
</html>
